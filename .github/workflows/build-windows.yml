name: Build Windows

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    defaults:
      run:
        working-directory: helios-desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Check environment
        run: |
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          echo "CWD: $(pwd)"
          echo "Dist files:"; Get-ChildItem -Recurse dist/main/*.js | Select-Object -ExpandProperty Name
          echo "Electron-builder:"; node -e "console.log(require.resolve('electron-builder'))"
          echo "Electron:"; node -e "console.log(require.resolve('electron'))"

      - name: Package Windows
        run: node node_modules/electron-builder/cli.js --win --x64

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helios-desktop-windows
          path: helios-desktop/release/

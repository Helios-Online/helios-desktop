name: Build Windows

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    defaults:
      run:
        working-directory: helios-desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Package Windows
        run: npx --package=electron-builder electron-builder --win --x64

      - uses: actions/upload-artifact@v4
        with:
          name: helios-desktop-windows
          path: helios-desktop/release/

name: Build Windows

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    defaults:
      run:
        working-directory: helios-desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify electron-builder
        run: npx electron-builder --version

      - name: Build and package
        run: npm run dist:win 2>&1 | Out-File -FilePath $env:GITHUB_WORKSPACE\build.log -Encoding utf8

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: helios-desktop-windows
          path: helios-desktop/release/

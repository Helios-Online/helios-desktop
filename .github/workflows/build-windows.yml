name: Build Windows

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    defaults:
      run:
        working-directory: helios-desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Package Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          npx electron-builder --win 2>&1 | Tee-Object -FilePath ../build-output.log
          if ($LASTEXITCODE -ne 0) {
            Write-Output "BUILD_FAILED_WITH_EXITCODE=$LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: build-output.log

      - uses: actions/upload-artifact@v4
        with:
          name: helios-desktop-windows
          path: helios-desktop/release/
